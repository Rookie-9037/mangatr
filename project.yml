name: MangaTR
options:
  bundleIdPrefix: com.mangatr
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: tr
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  MangaTR:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mangatr.MangaTR
        PRODUCT_NAME: MangaTR
        INFOPLIST_FILE: Supporting/App-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"

  MangaTRExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Extension
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mangatr.MangaTR.Extension
        PRODUCT_NAME: MangaTRExtension
        INFOPLIST_FILE: Supporting/Extension-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
    dependencies:
      - target: MangaTR
        embed: true

schemes:
  MangaTR:
    build:
      targets:
        MangaTR: all
        MangaTRExtension: all
    run:
      config: Debug
    archive:
      config: Release