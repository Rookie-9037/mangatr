name: Build

# Mac olmadan derleme: GitHub'in macOS runner'ı Xcode'u kurar, XcodeGen projeyi
# üretir, xcodebuild imzasız bir .ipa çıkarır. Cihaza yükleme adımı
# Sideloadly/SideStore ile Windows'tan yapılır.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Derleme kontrolü (simülatör)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # The JavaScript half is where most of the product lives, and the Swift
      # build says nothing about it. These suites run on every push: they caught a
      # reply that was read outside its { ok, result } envelope, which would have
      # shipped as "OCR silently finds nothing" rather than as a build failure.
      - name: JavaScript testleri
        run: |
          set -e
          for f in Extension/Resources/*.js tools/*.js; do node --check "$f"; done
          for suite in lang-check translate-check overlay-check preview-check \
                       popup-check connection-check vision-check; do
            echo "--- $suite ---"
            node "tools/$suite.js"
          done

      - name: XcodeGen kur
        run: brew install xcodegen

      - name: Projeyi üret
        run: xcodegen generate --spec project.yml

      - name: Simülatör için derle
        run: |
          set -o pipefail
          xcodebuild \
            -project MangaTR.xcodeproj \
            -scheme MangaTR \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

  ipa:
    name: İmzasız .ipa
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: XcodeGen kur
        run: brew install xcodegen

      - name: Projeyi üret
        run: xcodegen generate --spec project.yml

      - name: Cihaz için derle
        run: |
          set -o pipefail
          xcodebuild \
            -project MangaTR.xcodeproj \
            -scheme MangaTR \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            build

      - name: .ipa paketle
        run: |
          APP="build/Build/Products/Release-iphoneos/MangaTR.app"
          EXT="$APP/PlugIns/MangaTRExtension.appex"
          test -d "$APP" || { echo "uygulama üretilmedi"; exit 1; }
          if [ ! -d "$EXT" ]; then
            echo "Safari eklentisi gömülmedi. .app içeriği:"
            ls "$APP"
            echo "--- PlugIns ---"
            ls "$APP/PlugIns" 2>&1 || echo "(PlugIns yok)"
            echo "--- derlenen tüm ürünler ---"
            find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.appex' -o -maxdepth 1 -name '*.app'
            exit 1
          fi

          # Safari web extensions want manifest.json at the .appex bundle root,
          # so fail loudly here rather than at runtime on the device.
          if [ ! -f "$EXT/manifest.json" ]; then
            echo "manifest.json .appex kökünde değil. İçerik:"
            find "$EXT" -maxdepth 2 -name 'manifest.json'
            exit 1
          fi

          node -e "JSON.parse(require('fs').readFileSync('$EXT/manifest.json','utf8')); console.log('manifest.json geçerli')"
          echo "--- eklenti kökü ---"
          ls "$EXT"

          rm -rf Payload MangaTR-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          # Zip from *outside* Payload so entries are stored as Payload/MangaTR.app/...
          # Sideloading tools reject the archive outright if the Payload directory
          # is missing ("guru meditation ... can't listdir a file").
          zip -qry MangaTR-unsigned.ipa Payload

          # Fail loudly rather than shipping an IPA nothing can install.
          if [ ! -f MangaTR-unsigned.ipa ]; then
            echo "ipa üretilmedi"; exit 1
          fi
          unzip -l MangaTR-unsigned.ipa | head -3

          echo "ipa boyutu: $(du -h MangaTR-unsigned.ipa)"

      - name: .ipa'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: MangaTR-unsigned-ipa
          path: MangaTR-unsigned.ipa
          retention-days: 30